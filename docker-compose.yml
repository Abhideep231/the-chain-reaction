services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      # Optional: local dev (this file exists) fills in values from disk;
      # Codespaces (this file never exists there) relies entirely on the
      # `environment:` block below instead, which is never blank so
      # Compose never fails to start over a missing file.
      - path: ./backend/.env
        required: false
    environment:
      # Bare names (no `=value`) pass the variable through only if it's
      # actually set in the invoking shell (GitHub Codespaces secrets are
      # real shell env vars there) — unlike `${VAR:-}` interpolation, this
      # does NOT declare the key at all when the shell doesn't have it, so
      # it can't blank out a real value already loaded from env_file below.
      # Where both exist, environment: still correctly wins over env_file.
      - OPENAI_API_KEY
      - ANTHROPIC_API_KEY
      # Pin storage paths to the mounted volumes below, regardless of the
      # (relative, local-dev-oriented) paths in backend/.env.
      - VECTOR_DB_PATH=/data/chromadb
      - UPLOAD_DIR=/data/uploads
    volumes:
      - chroma-data:/data/chromadb
      - upload-data:/data/uploads

  frontend:
    build:
      context: .
      args:
        # A relative path, not an absolute URL: the browser resolves it
        # against the page's own origin, so the request never leaves
        # port 3000 — this is what avoids GitHub Codespaces' forwarded-port
        # authentication proxy rejecting cross-port JS requests. Next.js
        # rewrites this same path server-side to the backend container
        # (see next.config.ts's BACKEND_INTERNAL_URL rewrite).
        NEXT_PUBLIC_API_URL: /api/backend
        # Must be a build arg, not just a runtime `environment:` entry:
        # `next build` resolves rewrites() into a static routes-manifest,
        # so the value has to be present during the build itself, not just
        # in the running container afterward.
        BACKEND_INTERNAL_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  chroma-data:
  upload-data:
